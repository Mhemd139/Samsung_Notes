name: Improve a translation
description: Fix a word in your language, or ask for a new language.
labels: [translation]
body:
  - type: input
    id: language
    attributes:
      label: Language
      placeholder: "e.g. Português (Brasil)"
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: What should change?
      description: Quote the current text and your better wording. Native speakers' fixes are merged first.
    validations:
      required: true
